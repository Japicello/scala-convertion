services:
  - type: web
    name: scala-convertion
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    branch: staging
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
